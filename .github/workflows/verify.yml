name: Verify site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify contact and interaction contracts
        run: node scripts/verify-site.cjs
      - name: Check contact script syntax
        run: node --check contact.js
